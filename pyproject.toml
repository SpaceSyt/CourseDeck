[project]
name = "coursedeck"
version = "0.1.0"
description = "A local-first, read-only university assignment aggregator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "playwright>=1.50,<2", "beautifulsoup4>=4.13,<5",
  "keyring>=25,<26", "google-auth-oauthlib>=1.2,<2", "tzdata>=2025.1",
  "pypdf>=6,<7",
  "pystray>=0.19.5,<0.20; sys_platform == 'win32'",
  "pillow>=11,<13; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
coursedeck = "coursedeck.__main__:main"

[project.gui-scripts]
coursedeck-tray = "coursedeck.tray:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
